[project]
name = "credit-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143",
    "httpx>=0.28",
    "joblib>=1.6",
    "ollama>=0.6",
    "pandas>=3.0",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "scikit-learn>=1.9",
    "sqlalchemy>=2.0",
    "wandb>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "credit_backend"

[tool.pytest.ini_options]
pythonpath = ["scripts", "tests"]
testpaths = ["tests"]
